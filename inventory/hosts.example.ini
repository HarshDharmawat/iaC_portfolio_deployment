[local]
localhost ansible_connection=local

[portfolio_servers]
APP_SERVER_PUBLIC_IP

[load_balancer]
LOAD_BALANCER_PUBLIC_IP

[monitoring_servers]
MONITORING_SERVER_PUBLIC_IP

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=./docker-engine-ec2.pem
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
app_private_ip=APP_SERVER_PRIVATE_IP
lb_private_ip=LOAD_BALANCER_PRIVATE_IP